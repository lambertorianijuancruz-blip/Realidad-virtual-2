<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelea VR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  body { margin:0; overflow:hidden; font-family: sans-serif; }
  /* BORDE ROJO CUANDO TE ATACA */
  #damage {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    box-shadow: inset 0 0 120px 60px rgba(255,0,0,0.9);
    opacity: 0; transition: opacity 0.2s;
  }
  #hud {
    position: fixed; top: 10px; left: 10px; right: 10px; z-index: 20;
    color: white; text-shadow: 1px 1px 3px black; pointer-events: none;
  }
  .bar { height: 18px; background: #333; border: 2px solid white; border-radius: 10px; overflow: hidden; margin-bottom: 5px; }
  #myHealth { height: 100%; width: 100%; background: limegreen; }
  #enemyHealth { height: 100%; width: 100%; background: red; }
  #msg {
    position: fixed; bottom: 20px; left: 0; right: 0; text-align: center;
    color: white; font-size: 20px; z-index: 20; text-shadow: 1px 1px 4px black; pointer-events: none;
  }
  #startBtn {
    position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
    padding: 15px 30px; font-size: 20px; border-radius: 15px; border: none;
    background: #ffcc00; z-index: 30;
  }
</style>
</head>
<body>

<div id="damage"></div>
<div id="hud">
  <div>YO ❤️</div><div class="bar"><div id="myHealth"></div></div>
  <div>OPONENTE 👹</div><div class="bar"><div id="enemyHealth"></div></div>
</div>
<div id="msg">Tocá al oponente para golpearlo. Mové la cámara para mirar.</div>
<button id="startBtn">▶ EMPEZAR PELEA</button>

<a-scene>
  <a-sky color="#87CEEB"></a-sky>
  <a-plane position="0 0 0" rotation="-90 0 0" width="40" height="40" color="#7BC8A4"></a-plane>

  <!-- JUGADOR / CAMARA -->
  <a-entity id="player" position="0 1.6 8">
    <a-camera look-controls wasd-controls>
      <a-cursor color="yellow" fuse="false"></a-cursor>
    </a-camera>
  </a-entity>

  <!-- OPONENTE -->
  <a-entity id="enemy" position="0 1.2 -2">
    <!-- cuerpo -->
    <a-box position="0 0 0" width="1" height="1.6" depth="0.6" color="#c0392b"></a-box>
    <!-- cabeza -->
    <a-box position="0 1.1 0" width="0.6" height="0.6" depth="0.6" color="#f1c27d"></a-box>
    <!-- ojos -->
    <a-box position="-0.15 1.15 0.32" width="0.12" height="0.12" depth="0.05" color="black"></a-box>
    <a-box position="0.15 1.15 0.32" width="0.12" height="0.12" depth="0.05" color="black"></a-box>
    <!-- brazos -->
    <a-box id="armL" position="-0.65 0.3 0" width="0.25" height="1" depth="0.25" color="#c0392b"></a-box>
    <a-box id="armR" position="0.65 0.3 0" width="0.25" height="1" depth="0.25" color="#c0392b"></a-box>
  </a-entity>
</a-scene>

<script>
let started = false;
let myHP = 100, enemyHP = 100;
let lastAttack = 0;
let enemyState = "chase"; // chase, attack, cooldown

const player = document.querySelector("#player");
const enemy = document.querySelector("#enemy");
const damageEl = document.querySelector("#damage");
const msgEl = document.querySelector("#msg");

document.querySelector("#startBtn").addEventListener("click", () => {
  started = true;
  document.querySelector("#startBtn").style.display = "none";
  msgEl.textContent = "¡Te está persiguiendo! Tocálo para pegarle.";
});

// VOS LO GOLPEAS - tocás al oponente
enemy.addEventListener("click", () => {
  if (!started) return;
  if (enemyHP <= 0) return;
  enemyHP -= 12;
  document.querySelector("#enemyHealth").style.width = enemyHP + "%";
  // lo empujás un poco para atrás
  let p = enemy.getAttribute("position");
  let pp = player.getAttribute("position");
  let dx = p.x - pp.x, dz = p.z - pp.z;
  let len = Math.sqrt(dx*dx + dz*dz) || 1;
  enemy.setAttribute("position", {x: p.x + dx/len*0.8, y: p.y, z: p.z + dz/len*0.8});
  // parpadea blanco cuando le pegás
  enemy.setAttribute("material", "color", "white");
  setTimeout(()=> enemy.removeAttribute("material"), 120);
  msgEl.textContent = "¡LE PEGASTE! Vida del oponente: " + enemyHP;
  if (enemyHP <= 0) {
    msgEl.textContent = "🏆 ¡GANASTE! Recargá la página para jugar de nuevo.";
    enemy.setAttribute("visible", "false");
  }
});

function showRedBorder() {
  damageEl.style.opacity = "1";
  // queda rojo 1.2 segundos y se va de a poco
  setTimeout(()=> damageEl.style.opacity = "0.6", 400);
  setTimeout(()=> damageEl.style.opacity = "0", 1200);
}

// LOOP PRINCIPAL - el oponente te persigue y ataca
function loop() {
  requestAnimationFrame(loop);
  if (!started || enemyHP <= 0 || myHP <= 0) return;

  let p = player.getAttribute("position");
  let e = enemy.getAttribute("position");
  let dx = p.x - e.x;
  let dz = p.z - e.z;
  let dist = Math.sqrt(dx*dx + dz*dz);

  // que mire siempre hacia vos
  enemy.object3D.lookAt(p.x, e.y, p.z);

  let now = Date.now();

  if (dist > 1.8) {
    // 1. ACORTAR DISTANCIA - te persigue
    enemyState = "chase";
    let speed = 0.045; // velocidad de persecución
    e.x += dx/dist * speed;
    e.z += dz/dist * speed;
    // animación de caminar (se balancea)
    enemy.setAttribute("position", {x: e.x, y: 1.2 + Math.sin(now*0.02)*0.05, z: e.z});
  } else {
    // 2. ESTÁ CERCA - ATACA cada 2 segundos
    enemy.setAttribute("position", {x: e.x, y: 1.2, z: e.z});
    if (now - lastAttack > 2000) {
      lastAttack = now;
      enemyState = "attack";
      // se lanza hacia vos
      e.x += dx/dist * 0.5;
      e.z += dz/dist * 0.5;
      enemy.setAttribute("position", {x: e.x, y: 1.2, z: e.z});

      // TE PEGA - te baja vida y pone borde rojo
      myHP -= 15;
      document.querySelector("#myHealth").style.width = myHP + "%";
      showRedBorder();
      msgEl.textContent = "¡TE PEGÓ! Tu vida: " + myHP;
      if (myHP <= 0) {
        msgEl.textContent = "💀 TE GANÓ. Recargá la página para revancha.";
      }
      // vuelve para atrás después del golpe
      setTimeout(()=>{
        let ee = enemy.getAttribute("position");
        enemy.setAttribute("position", {x: ee.x - dx/dist*0.5, y: 1.2, z: ee.z - dz/dist*0.5});
      }, 300);
    }
  }
}
loop();
</script>
</body>
</html>
